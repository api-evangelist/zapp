name: Zapp
description: >-
  Zapp is a London-based premium quick-commerce (q-commerce) business that delivers
  daily essentials such as snacks, drinks, groceries, household items and pharmacy
  needs across central London in minutes, 24/7. Founded in 2020 by Navid Hadzaad and
  Joe Falter, the company operates a network of micro-fulfilment "dark stores" and a
  consumer mobile app (iOS and Android) rather than a public developer platform. Zapp
  is a venture-backed company whose investors include Lightspeed Venture Partners. As
  of this profile, Zapp exposes no public developer API, developer portal, or API
  documentation; it is a business-to-consumer delivery brand surfaced in the API
  Evangelist network as a company lead.
